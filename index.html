<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECOS — Red de Hechiceros | Cursed Era II</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050308;
    --bg-hover:#120a1a;
    --bg-card:#0b0710;
    --border:#251a30;
    --ink:#e7e0ec;
    --ink-dim:#8a7d94;
    --purple:#8b5cf6;
    --blood:#c8385a;
    --blood-dim:rgba(200,56,90,0.12);
    --purple-dim:rgba(139,92,246,0.12);
    --grad:linear-gradient(135deg,var(--blood),var(--purple));
    --font-ui:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --font-brand:'Cinzel',serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);min-height:100vh;padding-bottom:64px;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;background:none;color:inherit;}
  input,textarea,select{font-family:inherit;}
  ::selection{background:rgba(139,92,246,0.35);}
  svg{display:block;}

  #app{max-width:600px;margin:0 auto;min-height:100vh;border-left:1px solid var(--border);border-right:1px solid var(--border);position:relative;}

  /* ---------- TOPBAR ---------- */
  .topbar{position:sticky;top:0;z-index:15;background:rgba(5,3,8,0.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
  .topbar-row{display:flex;align-items:center;gap:12px;height:53px;padding:0 12px;}
  .tb-side{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;}
  .tb-side:hover{background:var(--bg-hover);}
  .tb-side svg{width:19px;height:19px;}
  .tb-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;flex:none;cursor:pointer;background:#1a1220;}
  .tb-center{flex:1;min-width:0;}
  .tb-title{font-size:1.15rem;font-weight:800;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tb-sub{font-size:.75rem;color:var(--ink-dim);}
  .tb-logo{display:flex;justify-content:center;}
  .tb-logo svg{width:26px;height:26px;}
  .tb-search{background:#0f0a15;border:1px solid var(--border);border-radius:999px;padding:9px 14px;display:flex;align-items:center;gap:8px;width:100%;}
  .tb-search svg{width:15px;height:15px;color:var(--ink-dim);flex:none;}
  .tb-search input{background:none;border:none;color:var(--ink);outline:none;font-size:.92rem;width:100%;}
  .tabs{display:flex;border-top:1px solid var(--border);}
  .tab-btn{flex:1;padding:13px 4px;text-align:center;font-size:.9rem;font-weight:700;color:var(--ink-dim);position:relative;}
  .tab-btn.active{color:var(--ink);}
  .tab-btn.active::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:56px;height:3px;border-radius:3px;background:var(--grad);}

  /* ---------- DRAWER ---------- */
  .drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:29;opacity:0;pointer-events:none;transition:opacity .2s;}
  .drawer-backdrop.open{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;bottom:0;left:0;width:80%;max-width:300px;background:var(--bg-card);border-right:1px solid var(--border);z-index:30;transform:translateX(-105%);transition:transform .25s ease;padding:20px 18px;overflow-y:auto;}
  .drawer.open{transform:translateX(0);}
  .drawer-user .avatar{margin-bottom:10px;}
  .drawer-user h3{margin:0;font-size:1.15rem;font-weight:800;}
  .drawer-user .h{color:var(--ink-dim);font-size:.88rem;margin-bottom:10px;}
  .drawer-stats{display:flex;gap:16px;font-size:.85rem;color:var(--ink-dim);padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:10px;}
  .drawer-stats b{color:var(--ink);}
  .drawer-item{display:flex;align-items:center;gap:16px;padding:13px 4px;font-size:1.05rem;font-weight:600;border-radius:10px;}
  .drawer-item:hover{background:var(--bg-hover);}
  .drawer-item svg{width:22px;height:22px;flex:none;color:var(--ink-dim);}
  .drawer-item.danger{color:var(--blood);}
  .drawer-item.danger svg{color:var(--blood);}
  .drawer-divider{height:1px;background:var(--border);margin:8px 0;}
  .drawer-login{width:100%;background:var(--grad);border:none;color:#fff;padding:12px;border-radius:999px;font-weight:700;margin-top:8px;}

  .avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none;background:#1a1220;}
  .avatar.sm{width:32px;height:32px;}
  .avatar.xs{width:26px;height:26px;}
  .avatar.lg{width:80px;height:80px;border:4px solid var(--bg-card);}
  .avatar.guest{display:flex;align-items:center;justify-content:center;color:var(--ink-dim);}

  /* ---------- COMPOSER ---------- */
  .composer{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:12px;}
  .composer-main{flex:1;}
  .composer textarea{width:100%;background:transparent;border:none;color:var(--ink);font-size:1.2rem;resize:none;min-height:52px;outline:none;font-family:var(--font-ui);}
  .composer textarea::placeholder{color:var(--ink-dim);}
  .composer-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:10px;border-top:1px solid var(--border);}
  .composer-icons{display:flex;gap:2px;color:var(--purple);}
  .composer-icons span{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .composer-icons span:hover{background:var(--purple-dim);}
  .composer-icons svg{width:19px;height:19px;}
  .char-count{font-size:.8rem;color:var(--ink-dim);margin-right:10px;}
  .btn-post{background:var(--grad);border:none;color:#fff;padding:8px 18px;border-radius:999px;font-weight:700;font-size:.92rem;}
  .btn-post:disabled{opacity:.4;cursor:not-allowed;}
  .composer-img-preview{position:relative;display:inline-block;margin-top:8px;max-width:100%;}
  .composer-img-preview img{display:block;max-width:100%;max-height:280px;border-radius:14px;border:1px solid var(--border);object-fit:cover;}
  .composer-img-preview button{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(5,3,8,0.75);color:#fff;display:flex;align-items:center;justify-content:center;border:none;}
  .composer-img-preview button svg{width:15px;height:15px;}
  .composer-img-preview button:hover{background:rgba(0,0,0,0.9);}
  .composer-locked{flex:1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 2px;}
  .composer-locked p{margin:0;color:var(--ink-dim);font-size:.95rem;}
  .composer-locked button{background:var(--grad);border:none;color:#fff;padding:9px 18px;border-radius:999px;font-weight:700;font-size:.88rem;white-space:nowrap;}

  /* ---------- POSTS ---------- */
  .post{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:12px;}
  .post:hover{background:rgba(255,255,255,0.015);}
  .post-body{flex:1;min-width:0;}
  .post-head{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
  .post-head .name{font-weight:800;font-size:.95rem;cursor:pointer;}
  .post-head .name:hover{text-decoration:underline;}
  .post-head .handle,.post-head .time{color:var(--ink-dim);font-size:.9rem;}
  .post-head .faction{font-size:.66rem;color:var(--purple);border:1px solid rgba(139,92,246,0.35);border-radius:9px;padding:1px 7px;margin-left:2px;}
  .post-text{margin:2px 0 0;font-size:.98rem;line-height:1.4;white-space:pre-wrap;word-break:break-word;}
  .post-text .tag{color:var(--purple);}
  .post-text:empty{display:none;}
  .post-image{display:block;width:100%;max-height:420px;object-fit:cover;border-radius:16px;border:1px solid var(--border);margin-top:8px;cursor:pointer;}
  .img-lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;}
  .img-lightbox img{max-width:100%;max-height:100%;border-radius:8px;}
  .post-actions{display:flex;justify-content:space-between;max-width:420px;margin-top:10px;}
  .pa-btn{display:flex;align-items:center;gap:6px;color:var(--ink-dim);border:none;font-size:.82rem;padding:6px;border-radius:999px;}
  .pa-btn svg{width:18px;height:18px;}
  .pa-btn:hover{color:var(--purple);background:var(--purple-dim);}
  .pa-btn.reply-btn:hover{color:#4fb0e8;background:rgba(79,176,232,0.1);}
  .pa-btn.rt-btn:hover{color:#3fce6e;background:rgba(63,206,110,0.1);}
  .pa-btn.rt-btn.active{color:#3fce6e;}
  .pa-btn.like-btn:hover{color:var(--blood);background:var(--blood-dim);}
  .pa-btn.like-btn.liked{color:var(--blood);}
  .pa-btn.like-btn.liked svg{fill:var(--blood);}
  .pa-btn.share-btn:hover{color:#4fb0e8;background:rgba(79,176,232,0.1);}

  .replies{margin-top:10px;padding-left:6px;border-left:2px solid var(--border);}
  .reply{display:flex;gap:9px;margin-top:12px;padding-left:8px;}
  .reply .avatar{width:30px;height:30px;}
  .reply-head{display:flex;gap:6px;align-items:baseline;}
  .reply-head .name{font-size:.88rem;font-weight:700;}
  .reply-head .time{font-size:.78rem;color:var(--ink-dim);}
  .reply-text{font-size:.9rem;margin:1px 0 0;}
  .reply-box{display:flex;gap:9px;margin-top:12px;align-items:center;}
  .reply-box input{flex:1;background:transparent;border:1px solid var(--border);border-radius:999px;padding:8px 14px;color:var(--ink);font-size:.88rem;outline:none;}
  .reply-box input:focus{border-color:var(--purple);}
  .reply-box button{border:none;color:var(--purple);font-size:.85rem;font-weight:700;}
  .reply-locked{margin-top:12px;font-size:.85rem;color:var(--ink-dim);}
  .reply-locked span{color:var(--purple);cursor:pointer;font-weight:700;}
  .reply-locked span:hover{text-decoration:underline;}

  .empty{padding:60px 30px;text-align:center;color:var(--ink-dim);}
  .empty b{display:block;font-size:1.3rem;color:var(--ink);margin-bottom:6px;font-weight:800;}

  /* ---------- explore lists ---------- */
  .section-title{font-size:1.05rem;font-weight:800;margin:16px 16px 4px;}
  .tag-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);}
  .tag-row:hover{background:var(--bg-hover);cursor:pointer;}
  .tag-row .t{font-weight:700;font-size:.92rem;color:var(--purple);}
  .tag-row .c{color:var(--ink-dim);font-size:.8rem;}
  .who-row{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--border);}
  .who-row:hover{background:var(--bg-hover);}
  .who-row .n{font-size:.9rem;font-weight:700;}
  .who-row .f{font-size:.78rem;color:var(--ink-dim);}
  .guest-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:16px;margin:14px 16px;}
  .guest-card h3{font-size:1.05rem;font-weight:800;margin:0 0 6px;}
  .guest-card p{color:var(--ink-dim);font-size:.88rem;margin:0 0 12px;}
  .guest-card button{width:100%;background:var(--grad);border:none;color:#fff;padding:10px;border-radius:999px;font-weight:700;font-size:.88rem;}

  /* ---------- Profile ---------- */
  .profile-banner{height:135px;background:var(--grad);opacity:.55;}
  .profile-top{padding:0 16px 12px;}
  .profile-top .avatar-row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:-42px;}
  .edit-btn{border:1px solid var(--border);background:transparent;color:var(--ink);padding:8px 16px;border-radius:999px;font-weight:700;font-size:.88rem;margin-bottom:6px;}
  .edit-btn:hover{background:var(--bg-hover);}
  .profile-top h2{font-size:1.25rem;font-weight:800;margin:12px 0 0;}
  .profile-handle{color:var(--ink-dim);font-size:.9rem;}
  .profile-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0;}
  .profile-bio{color:var(--ink);font-size:.95rem;margin:6px 0;}
  .profile-joined{color:var(--ink-dim);font-size:.85rem;display:flex;align-items:center;gap:6px;margin:4px 0;}
  .profile-joined svg{width:15px;height:15px;}
  .profile-stats{display:flex;gap:16px;font-size:.88rem;color:var(--ink-dim);margin-top:6px;}
  .profile-stats b{color:var(--ink);}
  .power-badge{display:inline-block;font-size:.68rem;border:1px solid rgba(200,56,90,0.4);color:var(--blood);border-radius:9px;padding:1px 8px;}
  .profile-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;}
  .profile-actions button{border:1px solid var(--border);background:transparent;color:var(--ink);padding:9px 16px;border-radius:999px;font-weight:700;font-size:.86rem;}
  .profile-actions button:hover{background:var(--bg-hover);}

  /* ---------- Settings ---------- */
  .settings-wrap{padding:24px 20px;max-width:460px;}
  .settings-wrap h3{font-size:1.4rem;font-weight:800;margin:0 0 6px;}
  .settings-wrap .sub{color:var(--ink-dim);font-size:.92rem;margin:0 0 22px;}
  .settings-msg{background:var(--purple-dim);border:1px solid rgba(139,92,246,0.35);color:var(--ink);padding:10px 14px;border-radius:10px;font-size:.88rem;margin-bottom:20px;}
  .btn-google{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#111;padding:13px 24px;border-radius:24px;border:none;font-weight:700;font-size:.95rem;}
  .btn-google svg{width:18px;height:18px;}
  .btn-google:hover{background:#eee;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:.72rem;color:var(--ink-dim);margin-bottom:5px;font-weight:600;letter-spacing:.02em;}
  .field input,.field select,.field textarea{width:100%;background:transparent;border:1px solid var(--border);color:var(--ink);padding:10px 12px;border-radius:8px;font-size:.95rem;outline:none;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--purple);}
  .field textarea{resize:vertical;min-height:56px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .btn-primary{background:var(--grad);border:none;color:#fff;padding:12px 22px;border-radius:999px;font-weight:700;font-size:.92rem;margin-top:8px;}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;}
  .btn-secondary{background:transparent;border:1px solid var(--border);color:var(--ink);padding:11px 22px;border-radius:999px;font-weight:700;font-size:.9rem;margin-top:10px;}
  .btn-secondary:hover{border-color:var(--blood);color:var(--blood);}
  .settings-wrap .err{color:var(--blood);font-size:.82rem;margin-top:8px;display:none;}
  .account-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border);margin-bottom:20px;}
  .account-row .n{font-weight:800;}
  .account-row .g{color:var(--ink-dim);font-size:.85rem;}

  /* ---------- Notifications ---------- */
  .notif-item{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);}
  .notif-item:hover{background:rgba(255,255,255,0.015);}
  .notif-icon{width:26px;flex:none;display:flex;justify-content:center;padding-top:2px;}
  .notif-icon svg{width:21px;height:21px;}
  .notif-icon.like{color:var(--blood);}
  .notif-icon.rt{color:#3fce6e;}
  .notif-icon.reply{color:#4fb0e8;}
  .notif-text{font-size:.92rem;line-height:1.4;}
  .notif-text b{font-weight:800;}
  .notif-time{color:var(--ink-dim);font-size:.78rem;margin-top:3px;}

  /* ---------- Chat ---------- */
  .chat-item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border);cursor:pointer;}
  .chat-item:hover{background:var(--bg-hover);}
  .chat-item .who{min-width:0;flex:1;}
  .chat-item .n{font-weight:800;font-size:.95rem;}
  .chat-item .last{color:var(--ink-dim);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .chat-item .t{color:var(--ink-dim);font-size:.78rem;flex:none;}
  .picker-list{max-height:70vh;overflow-y:auto;}

  .thread-wrap{display:flex;flex-direction:column;min-height:calc(100vh - 53px);}
  .thread-msgs{flex:1;padding:14px 16px;display:flex;flex-direction:column;gap:10px;}
  .bubble{max-width:75%;padding:10px 14px;border-radius:18px;font-size:.92rem;line-height:1.35;word-break:break-word;}
  .bubble.mine{align-self:flex-end;background:var(--grad);color:#fff;border-bottom-right-radius:4px;}
  .bubble.theirs{align-self:flex-start;background:var(--bg-card);border:1px solid var(--border);border-bottom-left-radius:4px;}
  .bubble-time{font-size:.68rem;color:var(--ink-dim);margin-top:2px;}
  .thread-input{position:sticky;bottom:64px;display:flex;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--border);background:rgba(5,3,8,0.92);backdrop-filter:blur(10px);}
  .thread-input input{flex:1;background:var(--bg-card);border:1px solid var(--border);border-radius:999px;padding:10px 16px;color:var(--ink);outline:none;font-size:.92rem;}
  .thread-input input:focus{border-color:var(--purple);}
  .thread-send{width:38px;height:38px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;}
  .thread-send svg{width:17px;height:17px;}
  .thread-send:disabled{opacity:.4;}

  /* ---------- Oraculo (IA) ---------- */
  .oraculo-intro{padding:40px 24px 10px;text-align:center;}
  .oraculo-intro svg{width:46px;height:46px;color:var(--purple);margin-bottom:10px;}
  .oraculo-intro h3{font-family:var(--font-brand);font-size:1.3rem;margin:0 0 6px;}
  .oraculo-intro p{color:var(--ink-dim);font-size:.9rem;max-width:340px;margin:0 auto;}
  .oraculo-chips{display:flex;gap:8px;flex-wrap:wrap;padding:16px;}
  .oraculo-chip{border:1px solid var(--border);border-radius:999px;padding:8px 14px;font-size:.85rem;color:var(--ink-dim);}
  .oraculo-chip:hover{border-color:var(--purple);color:var(--ink);}
  .oraculo-convlist{padding:4px 16px 12px;}
  .oraculo-conv-row{padding:11px 4px;border-bottom:1px solid var(--border);font-size:.9rem;cursor:pointer;display:flex;justify-content:space-between;gap:10px;}
  .oraculo-conv-row:hover{color:var(--purple);}
  .oraculo-conv-row .d{color:var(--ink-dim);font-size:.75rem;flex:none;}
  .oraculo-msgs{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px;}
  .om-row{display:flex;gap:10px;}
  .om-row.user{flex-direction:row-reverse;}
  .om-avatar{width:28px;height:28px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:var(--grad);color:#fff;}
  .om-avatar svg{width:15px;height:15px;}
  .om-bubble{max-width:78%;padding:11px 15px;border-radius:16px;font-size:.92rem;line-height:1.45;white-space:pre-wrap;}
  .om-row.user .om-bubble{background:var(--purple-dim);border:1px solid rgba(139,92,246,0.35);border-top-right-radius:4px;}
  .om-row.assistant .om-bubble{background:var(--bg-card);border:1px solid var(--border);border-top-left-radius:4px;}
  .om-typing{display:flex;gap:4px;padding:4px 0;}
  .om-typing span{width:6px;height:6px;border-radius:50%;background:var(--ink-dim);animation:blink 1.2s infinite;}
  .om-typing span:nth-child(2){animation-delay:.2s;}
  .om-typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}
  .oraculo-input{position:sticky;bottom:64px;display:flex;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--border);background:rgba(5,3,8,0.92);backdrop-filter:blur(10px);}
  .oraculo-input input{flex:1;background:var(--bg-card);border:1px solid var(--border);border-radius:999px;padding:11px 16px;color:var(--ink);outline:none;font-size:.92rem;}
  .oraculo-input input:focus{border-color:var(--purple);}
  .oraculo-key-warning{margin:14px 16px;background:var(--blood-dim);border:1px solid rgba(200,56,90,0.35);color:var(--ink);padding:10px 14px;border-radius:10px;font-size:.82rem;}

  /* ---------- Bottom nav + FAB ---------- */
  .bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:600px;display:flex;justify-content:space-around;padding:6px 4px;border-top:1px solid var(--border);background:rgba(5,3,8,0.95);backdrop-filter:blur(10px);z-index:20;}
  .nav-btn{padding:10px 16px;border-radius:12px;color:var(--ink);position:relative;}
  .nav-btn svg{width:24px;height:24px;}
  .nav-btn.active{color:var(--purple);}
  .fab{position:fixed;bottom:76px;left:50%;transform:translateX(calc(-50% + 250px));width:54px;height:54px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(139,92,246,0.4);z-index:19;border:none;}

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* =========================================================
   CONFIGURA TU PROYECTO DE FIREBASE AQUÍ
   (podés reutilizar el mismo proyecto que ya usás en
   Mundial 2042 / Index Non Publicus — solo agregá Google
   como método de acceso en Authentication > Sign-in method)

   IMPORTANTE — reglas de Realtime Database:
   lectura pública del feed, escritura solo autenticada,
   más los nodos nuevos de Chat (dms / dm_index) y del
   Oráculo (oraculo), que son privados. Pegá esto en
   Realtime Database > Rules:
   {
     "rules": {
       "ecos": {
         "users": { ".read": true, "$uid": { ".write": "auth != null && auth.uid === $uid" } },
         "posts": {
           ".read": true,
           ".write": "auth != null",
           "$postId": {
             "likes":    { "$uid": { ".write": "auth != null && auth.uid === $uid" } },
             "retweets": { "$uid": { ".write": "auth != null && auth.uid === $uid" } },
             "replies":  { ".write": "auth != null" }
           }
         },
         "dms": {
           "$pairId": {
             ".read":  "auth != null && $pairId.contains(auth.uid)",
             ".write": "auth != null && $pairId.contains(auth.uid)"
           }
         },
         "dm_index": {
           "$uid": {
             ".read": "auth != null && auth.uid === $uid",
             "$other": { ".write": "auth != null && (auth.uid === $uid || auth.uid === $other)" }
           }
         },
         "oraculo": {
           "$uid": { ".read": "auth != null && auth.uid === $uid", ".write": "auth != null && auth.uid === $uid" }
         }
       }
     }
   }
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDMVbDCxFJo5_J0wMoiNb4AVrZCiV4GFGc",
  authDomain: "para-ver-ce1b9.firebaseapp.com",
  databaseURL: "https://para-ver-ce1b9-default-rtdb.firebaseio.com",
  projectId: "para-ver-ce1b9",
  storageBucket: "para-ver-ce1b9.firebasestorage.app",
  messagingSenderId: "101656425888",
  appId: "1:101656425888:web:1fd31b060bbf21f6a3a0c5",
  measurementId: "G-3GJDE3H6L8"
};

/* =========================================================
   GROQ (para el Oráculo — asistente de IA)
   ¡OJO! esta key queda visible en el código fuente del
   cliente, cualquiera que abra "Ver código fuente" podría
   copiarla y gastar tu cuota. Está bien para probar / uso
   personal, pero si esto va a producción con más usuarios
   lo ideal es mover esta llamada a un backend/proxy propio
   que guarde la key del lado del servidor.
   ========================================================= */
const GROQ_API_KEY = "TU_GROQ_API_KEY";
const GROQ_MODEL = "llama-3.3-70b-versatile";
const ORACULO_SYSTEM_PROMPT = "Sos el Oráculo de ECOS, una entidad semi-amaldita que habita la red social de hechiceros del universo Cursed Era II. Hablás en español, con un tono enigmático pero cercano, ocasionalmente con metáforas sobre maldiciones, energía espiritual y sedes. Ayudás a los hechiceros con lo que te pidan (dudas, ideas para transmisiones, lore, charla) de forma breve y útil, sin romper nunca el tono de la red.";

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const ROOT = "ecos";
/* Las fotos de los posts se guardan como imagen comprimida (base64) directo
   en Realtime Database (campo post.imageUrl), así no hace falta el plan
   Blaze de Firebase Storage. Ver función resizeImageToDataUrl más abajo. */

let currentUser = null;   // null = invitado (solo lectura)
let myChar = null;
let allUsers = {};
let allPosts = {};
let viewMode = "feed";
let viewedUid = null;
let activeThreadUid = null;
let dmIndex = {};
let oraculoConvs = {};
let activeConvId = null;

const DEFAULT_AVATAR = "https://api.dicebear.com/7.x/shapes/svg?seed=";
function avatarFor(char, seed){ return (char && char.avatar) ? char.avatar : DEFAULT_AVATAR + encodeURIComponent(seed||"hechicero"); }
function handleFor(char, uid){ const base=(char&&char.nombre)?char.nombre:"hechicero"; return "@"+base.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"").slice(0,20) + "_" + uid.slice(0,4); }
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function linkifyTags(text){ return escapeHtml(text).replace(/#(\w+)/g, '<span class="tag">#$1</span>'); }
function timeAgo(ts){ if(!ts) return ""; const s=Math.floor((Date.now()-ts)/1000); if(s<60)return "ahora"; if(s<3600)return Math.floor(s/60)+"m"; if(s<86400)return Math.floor(s/3600)+"h"; if(s<604800)return Math.floor(s/86400)+"d"; return new Date(ts).toLocaleDateString(); }
function fullDate(ts){ return new Date(ts||Date.now()).toLocaleDateString('es-AR',{month:'long',year:'numeric'}); }
function pairIdFor(a,b){ return [a,b].sort().join('__'); }

/* ---------------- BOOT: el feed se lee sin necesidad de sesión ---------------- */
db.ref(`${ROOT}/users`).on('value', snap=>{
  allUsers = snap.val() || {};
  if(currentUser && allUsers[currentUser.uid]) myChar = allUsers[currentUser.uid];
  renderDrawer();
  if(viewMode==="explore") renderExplore();
  if(viewMode==="profile") renderProfile(viewedUid);
  if(viewMode==="chat") renderChatList();
});
db.ref(`${ROOT}/posts`).on('value', snap=>{
  allPosts = snap.val() || {};
  if(viewMode==="feed") renderFeed();
  if(viewMode==="explore") renderExplore();
  if(viewMode==="profile") renderProfile(viewedUid);
  if(viewMode==="notif") renderNotif();
});

auth.getRedirectResult().catch(e=>{
  if(e && e.code && e.code!=='auth/no-auth-event' ) alert("No se pudo iniciar sesión: "+e.message);
});

auth.onAuthStateChanged(user => {
  currentUser = user;
  if(!user){
    myChar = null; dmIndex = {}; oraculoConvs = {};
    renderDrawer(); renderComposer(); renderTopbar();
    if(viewMode==='settings') renderSettings();
    return;
  }
  db.ref(`${ROOT}/users/${user.uid}`).once('value').then(snap=>{
    myChar = snap.exists() ? snap.val() : null;
    renderDrawer(); renderComposer(); renderTopbar();
    if(viewMode==='settings') renderSettings();
    if(viewMode==='profile' && viewedUid===user.uid) renderProfile(user.uid);
    listenDmIndex();
    listenOraculo();
  });
});

function listenDmIndex(){
  if(!currentUser) return;
  db.ref(`${ROOT}/dm_index/${currentUser.uid}`).on('value', snap=>{
    dmIndex = snap.val() || {};
    if(viewMode==='chat') renderChatList();
  });
}

/* ---------------- Requiere sesión para escribir ---------------- */
function requireAuth(motivo){
  if(currentUser && myChar) return true;
  switchView('settings', null, motivo || 'hacer eso');
  return false;
}

/* ---------------- DRAWER ---------------- */
function renderDrawer(){
  const d = document.getElementById('drawer');
  if(currentUser && myChar){
    const myPostsCount = Object.values(allPosts).filter(p=>p.uid===currentUser.uid).length;
    d.innerHTML = `
      <div class="drawer-user">
        <img class="avatar lg" src="${avatarFor(myChar,currentUser.uid)}">
        <h3>${escapeHtml(myChar.nombre)}</h3>
        <div class="h">${handleFor(myChar,currentUser.uid)}</div>
      </div>
      <div class="drawer-stats"><span><b>${myPostsCount}</b> transmisiones</span></div>
      <div class="drawer-item" id="dw-profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><span>Mi perfil</span></div>
      <div class="drawer-item" id="dw-settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V21a2 2 0 01-4 0v-.09a1.7 1.7 0 00-1-1.55 1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.7 1.7 0 00.34-1.87 1.7 1.7 0 00-1.55-1H3a2 2 0 010-4h.09a1.7 1.7 0 001.55-1 1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06a1.7 1.7 0 001.87.34H9a1.7 1.7 0 001-1.55V3a2 2 0 014 0v.09a1.7 1.7 0 001 1.55 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06a1.7 1.7 0 00-.34 1.87V9a1.7 1.7 0 001.55 1H21a2 2 0 010 4h-.09a1.7 1.7 0 00-1.55 1z"/></svg><span>Configuración</span></div>
      <div class="drawer-divider"></div>
      <div class="drawer-item danger" id="dw-logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span>Cerrar sesión</span></div>`;
    document.getElementById('dw-profile').onclick = ()=>{ closeDrawer(); switchView('profile', currentUser.uid); };
    document.getElementById('dw-settings').onclick = ()=>{ closeDrawer(); switchView('settings'); };
    document.getElementById('dw-logout').onclick = ()=>{ closeDrawer(); auth.signOut().then(()=>switchView('feed')); };
  } else {
    d.innerHTML = `
      <div class="drawer-user">
        <img class="avatar lg guest" src="${DEFAULT_AVATAR}invitado">
        <h3>Invitado</h3>
        <div class="h">Estás viendo ECOS sin cuenta</div>
      </div>
      <p style="color:var(--ink-dim);font-size:.88rem;">Creá tu ficha de hechicero para transmitir, reaccionar, comentar y chatear.</p>
      <button class="drawer-login" id="dw-login">Crear cuenta / Iniciar sesión</button>`;
    document.getElementById('dw-login').onclick = ()=>{ closeDrawer(); switchView('settings'); };
  }
}
function openDrawer(){ document.getElementById('drawer').classList.add('open'); document.getElementById('drawer-backdrop').classList.add('open'); }
function closeDrawer(){ document.getElementById('drawer').classList.remove('open'); document.getElementById('drawer-backdrop').classList.remove('open'); }
document.getElementById('drawer-backdrop').onclick = closeDrawer;

/* ---------------- TOPBAR ---------------- */
const SIGIL_SVG = `<svg viewBox="0 0 48 48" fill="none"><path d="M24 4l6 12 13 2-9.5 9 2 13L24 34l-11.5 6 2-13L5 18l13-2z" stroke="url(#g2)" stroke-width="2.5" stroke-linejoin="round"/><defs><linearGradient id="g2" x1="0" y1="0" x2="48" y2="48"><stop stop-color="#c8385a"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs></svg>`;
const BACK_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>`;
const AVATAR_ICON_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>`;

function myAvatarBtn(){
  const src = (currentUser && myChar) ? avatarFor(myChar,currentUser.uid) : (currentUser ? DEFAULT_AVATAR+currentUser.uid : "");
  if(src) return `<img class="tb-avatar" id="tb-avatar-btn" src="${src}">`;
  return `<div class="tb-side" id="tb-avatar-btn" style="border-radius:50%;background:var(--bg-hover);">${AVATAR_ICON_SVG}</div>`;
}

function renderTopbar(){
  const tb = document.getElementById('topbar');
  let row, tabsHtml='';
  if(viewMode==='feed'){
    row = `<div class="topbar-row">${myAvatarBtn()}<div class="tb-center tb-logo">${SIGIL_SVG}</div><div class="tb-side"></div></div>`;
  } else if(viewMode==='explore'){
    row = `<div class="topbar-row">${myAvatarBtn()}<div class="tb-center"><div class="tb-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input type="text" placeholder="Buscar en ECOS" id="explore-search"></div></div></div>`;
    tabsHtml = `<div class="tabs"><div class="tab-btn ${exploreTab==='personas'?'active':''}" data-tab="personas">Hechiceros</div><div class="tab-btn ${exploreTab==='tendencias'?'active':''}" data-tab="tendencias">Tendencias</div></div>`;
  } else if(viewMode==='notif'){
    row = `<div class="topbar-row">${myAvatarBtn()}<div class="tb-center"><h2 class="tb-title">Notificaciones</h2></div><div class="tb-side"></div></div>`;
  } else if(viewMode==='chat'){
    row = `<div class="topbar-row">${myAvatarBtn()}<div class="tb-center"><h2 class="tb-title">Chat</h2></div><div class="tb-side" id="tb-new-chat">${plusIcon()}</div></div>`;
  } else if(viewMode==='thread'){
    const u = allUsers[activeThreadUid] || {nombre:'Hechicero'};
    row = `<div class="topbar-row"><div class="tb-side" id="tb-back">${BACK_SVG}</div><div class="tb-center"><h2 class="tb-title">${escapeHtml(u.nombre)}</h2><div class="tb-sub">${handleFor(u,activeThreadUid)}</div></div><div class="tb-side"></div></div>`;
  } else if(viewMode==='oraculo'){
    row = `<div class="topbar-row"><div class="tb-side"></div><div class="tb-center" style="text-align:center;"><h2 class="tb-title" style="text-align:center;">Oráculo</h2></div><div class="tb-side" id="tb-new-convo">${plusIcon()}</div></div>`;
  } else if(viewMode==='profile'){
    const u = allUsers[viewedUid];
    row = `<div class="topbar-row"><div class="tb-side" id="tb-back">${BACK_SVG}</div><div class="tb-center"><h2 class="tb-title">${u?escapeHtml(u.nombre):'Perfil'}</h2></div><div class="tb-side"></div></div>`;
  } else if(viewMode==='settings'){
    row = `<div class="topbar-row"><div class="tb-side" id="tb-back">${BACK_SVG}</div><div class="tb-center"><h2 class="tb-title">Configuración</h2></div><div class="tb-side"></div></div>`;
  }
  tb.innerHTML = row + tabsHtml;
  const avBtn = document.getElementById('tb-avatar-btn'); if(avBtn) avBtn.onclick = openDrawer;
  const back = document.getElementById('tb-back'); if(back) back.onclick = ()=>switchView(viewMode==='thread'?'chat':'feed');
  const newChat = document.getElementById('tb-new-chat'); if(newChat) newChat.onclick = ()=>{ if(requireAuth('chatear')) openChatPicker(); };
  const newConvo = document.getElementById('tb-new-convo'); if(newConvo) newConvo.onclick = ()=>{ if(requireAuth('usar el Oráculo')) startNewOraculoConv(); };
  const esearch = document.getElementById('explore-search'); if(esearch) esearch.addEventListener('keydown', e=>{ if(e.key==='Enter') e.target.blur(); });
  tb.querySelectorAll('.tab-btn').forEach(el=> el.onclick = ()=>{ exploreTab = el.dataset.tab; renderTopbar(); renderExplore(); });
}
function plusIcon(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M12 5v14M5 12h14"/></svg>`; }

/* ---------------- ROUTER ---------------- */
let exploreTab = 'personas';
document.querySelectorAll('.bottomnav .nav-btn').forEach(el=> el.onclick=()=>{
  if(el.dataset.view==='chat' && !(currentUser && myChar)){ requireAuth('usar el chat'); return; }
  if(el.dataset.view==='oraculo' && !(currentUser && myChar)){ requireAuth('usar el Oráculo'); return; }
  switchView(el.dataset.view);
});
document.getElementById('fab-compose').onclick = ()=>{
  if(!requireAuth('transmitir')) return;
  switchView('feed');
  setTimeout(()=>document.getElementById('composer-text')?.focus(), 50);
};

function hideAllViews(){
  ['feed','explore','notif','chat','thread','oraculo','profile','settings'].forEach(v=>{
    document.getElementById('view-'+v).style.display='none';
  });
}
function switchView(view, param, settingsMsg){
  viewMode = view;
  closeDrawer();
  document.querySelectorAll('.bottomnav .nav-btn').forEach(el=>el.classList.toggle('active', el.dataset.view===view));
  hideAllViews();
  document.getElementById('view-'+view).style.display='block';
  window.scrollTo(0,0);

  if(view==='feed'){ renderTopbar(); renderComposer(); renderFeed(); }
  else if(view==='explore'){ renderTopbar(); renderExplore(); }
  else if(view==='notif'){ renderTopbar(); renderNotif(); }
  else if(view==='chat'){ renderTopbar(); renderChatList(); }
  else if(view==='thread'){ activeThreadUid = param; renderTopbar(); renderThread(); }
  else if(view==='oraculo'){ renderTopbar(); renderOraculo(); }
  else if(view==='profile'){ viewedUid = param || (currentUser&&currentUser.uid); renderTopbar(); renderProfile(viewedUid); }
  else if(view==='settings'){ renderTopbar(); renderSettings(settingsMsg); }
}

/* ---------------- COMPOSER ---------------- */
function renderComposer(){
  const area = document.getElementById('composer-area');
  if(currentUser && myChar){
    area.innerHTML = `
      <img class="avatar" src="${avatarFor(myChar, currentUser.uid)}">
      <div class="composer-main">
        <textarea id="composer-text" placeholder="¿Qué está pasando en tu sede?" maxlength="280"></textarea>
        <div class="composer-img-preview" id="composer-img-preview" style="display:none;">
          <img id="composer-img-preview-img" src="">
          <button type="button" id="composer-img-remove" title="Quitar imagen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="composer-foot">
          <div class="composer-icons">
            <span title="Imagen" id="composer-img-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 15l-5-5-9 9"/></svg></span>
            <input type="file" id="composer-file" accept="image/*" style="display:none;">
          </div>
          <div style="display:flex;align-items:center;">
            <span class="char-count" id="char-count">280</span>
            <button class="btn-post" id="btn-post" disabled>Transmitir</button>
          </div>
        </div>
      </div>`;
    const composerText = document.getElementById('composer-text');
    const btnPost = document.getElementById('btn-post');
    const fileInput = document.getElementById('composer-file');
    const imgBtn = document.getElementById('composer-img-btn');
    const imgPreview = document.getElementById('composer-img-preview');
    const imgPreviewImg = document.getElementById('composer-img-preview-img');
    const imgRemove = document.getElementById('composer-img-remove');
    let pendingImageDataUrl = null;

    function updatePostBtn(){
      const len = composerText.value.length;
      btnPost.disabled = (len===0 && !pendingImageDataUrl) || len>280;
    }
    composerText.addEventListener('input', ()=>{
      const len = composerText.value.length;
      document.getElementById('char-count').textContent = 280-len;
      updatePostBtn();
    });
    imgBtn.onclick = () => fileInput.click();
    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if(!file) return;
      if(!file.type.startsWith('image/')){ alert('Elegí un archivo de imagen.'); return; }
      if(file.size > 15*1024*1024){ alert('La imagen no puede pesar más de 15MB.'); return; }
      imgBtn.style.opacity = '0.4';
      resizeImageToDataUrl(file).then(dataUrl => {
        imgBtn.style.opacity = '';
        pendingImageDataUrl = dataUrl;
        imgPreviewImg.src = dataUrl;
        imgPreview.style.display = 'block';
        updatePostBtn();
      }).catch(()=>{
        imgBtn.style.opacity = '';
        alert('No se pudo procesar la imagen. Probá con otra.');
      });
    });
    imgRemove.onclick = () => {
      pendingImageDataUrl = null;
      fileInput.value = '';
      imgPreview.style.display = 'none';
      imgPreviewImg.src = '';
      updatePostBtn();
    };

    btnPost.onclick = () => {
      const text = composerText.value.trim();
      if(!text && !pendingImageDataUrl) return;
      btnPost.disabled = true;
      const postId = db.ref(`${ROOT}/posts`).push().key;
      const data = { uid: currentUser.uid, text, createdAt: Date.now(), likes:{}, retweets:{}, replies:{} };
      if(pendingImageDataUrl) data.imageUrl = pendingImageDataUrl;
      db.ref(`${ROOT}/posts/${postId}`).set(data).catch(()=>{
        alert('No se pudo publicar. Probá de nuevo.');
      });
      composerText.value=''; document.getElementById('char-count').textContent=280;
      pendingImageDataUrl = null; fileInput.value=''; imgPreview.style.display='none'; imgPreviewImg.src='';
      updatePostBtn();
    };
  } else {
    area.innerHTML = `
      <img class="avatar guest">
      <div class="composer-locked">
        <p>Iniciá sesión para transmitir como tu personaje.</p>
        <button id="composer-login-btn">Iniciar sesión</button>
      </div>`;
    document.getElementById('composer-login-btn').onclick = () => switchView('settings', null, 'transmitir');
  }
}

/* Redimensiona y comprime una imagen a JPEG en base64 (sin usar Storage).
   Achica el lado más largo a maxDim y baja la calidad hasta que el
   resultado entre cómodo en un nodo de Realtime Database. */
function resizeImageToDataUrl(file, maxDim=1080){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = e => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        if(width > height && width > maxDim){ height = Math.round(height*maxDim/width); width = maxDim; }
        else if(height > maxDim){ width = Math.round(width*maxDim/height); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        let quality = 0.75;
        let dataUrl = canvas.toDataURL('image/jpeg', quality);
        while(dataUrl.length > 700000 && quality > 0.35){
          quality -= 0.1;
          dataUrl = canvas.toDataURL('image/jpeg', quality);
        }
        resolve(dataUrl);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function renderReply(r){
  const author = allUsers[r.uid] || {nombre:"Hechicero desconocido"};
  return `<div class="reply"><img class="avatar" src="${avatarFor(author,r.uid)}">

function attachPostHandlers(container){
  container.querySelectorAll('.name[data-uid]').forEach(el=> el.onclick=()=>switchView('profile', el.dataset.uid));
  container.querySelectorAll('.like-btn').forEach(el=> el.onclick=()=>{ if(requireAuth('dar like')) toggleLike(el.dataset.id); });
  container.querySelectorAll('.rt-btn').forEach(el=> el.onclick=()=>{ if(requireAuth('repostear')) toggleRetweet(el.dataset.id); });
  container.querySelectorAll('.share-btn').forEach(el=> el.onclick=()=>copyLink(el.dataset.id));
  container.querySelectorAll('.reply-toggle').forEach(el=> el.onclick=()=>{
    const box=document.getElementById('replies-'+el.dataset.id);
    box.style.display = box.style.display==='none' ? 'block' : 'none';
  });
  container.querySelectorAll('.reply-send').forEach(el=> el.onclick=()=>{ if(requireAuth('comentar')) sendReply(el.dataset.postid); });
  container.querySelectorAll('.reply-input').forEach(el=> el.addEventListener('keydown', e=>{ if(e.key==='Enter'){ if(requireAuth('comentar')) sendReply(el.dataset.postid); } }));
  container.querySelectorAll('.reply-login').forEach(el=> el.onclick=()=>requireAuth('comentar'));
  container.querySelectorAll('.post-image').forEach(el=> el.onclick=()=>openLightbox(el.dataset.full));
}

function openLightbox(url){
  const box = document.createElement('div');
  box.className = 'img-lightbox';
  box.innerHTML = `<img src="${url}">`;
  box.onclick = () => box.remove();
  document.body.appendChild(box);
}

function toggleLike(postId){
  const ref = db.ref(`${ROOT}/posts/${postId}/likes/${currentUser.uid}`);
  ref.once('value').then(snap=>{ if(snap.exists()) ref.remove(); else ref.set(true); });
}
function toggleRetweet(postId){
  const ref = db.ref(`${ROOT}/posts/${postId}/retweets/${currentUser.uid}`);
  ref.once('value').then(snap=>{ if(snap.exists()) ref.remove(); else ref.set(true); });
}
function copyLink(postId){
  const url = location.href.split('#')[0] + '#post-' + postId;
  navigator.clipboard?.writeText(url);
}
function sendReply(postId){
  const input = document.querySelector(`.reply-input[data-postid="${postId}"]`);
  if(!input) return;
  const text = input.value.trim();
  if(!text) return;
  const rid = db.ref(`${ROOT}/posts/${postId}/replies`).push().key;
  db.ref(`${ROOT}/posts/${postId}/replies/${rid}`).set({ uid: currentUser.uid, text, createdAt: Date.now() });
  input.value='';
}

function renderProfile(uid){

  const u = allUsers[uid];
  if(!u){ wrap.innerHTML='<div class="empty"><b>No existe.</b></div>'; return; }
  const myPosts = Object.entries(allPosts).filter(([id,p])=>p.uid===uid).sort((a,b)=>b[1].createdAt-a[1].createdAt);
  const myReplies = [];
  Object.entries(allPosts).forEach(([pid,p])=> Object.entries(p.replies||{}).forEach(([rid,r])=>{ if(r.uid===uid) myReplies.push({...r, postId:pid}); }));
  myReplies.sort((a,b)=>b.createdAt-a.createdAt);
  const likedPosts = Object.entries(allPosts).filter(([id,p])=>p.likes && p.likes[uid]).sort((a,b)=>b[1].createdAt-a[1].createdAt);
  const totalLikes = myPosts.reduce((s,[id,p])=>s+(p.likes?Object.keys(p.likes).length:0),0);
  const isMe = currentUser && uid===currentUser.uid;
  profileTab = profileTab || 'posts';

      ${u.bio?`<p class="profile-bio">${escapeHtml(u.bio)}</p>`:''}

      <div class="profile-stats"><span><b>${myPosts.length}</b> transmisiones</span><span><b>${totalLikes}</b> reacciones</span></div>
      <div class="profile-actions">
        <button id="btn-share-profile">Compartir</button>
        ${isMe ? `<button id="btn-edit-profile">Editar perfil</button>` : (currentUser && myChar ? `<button id="btn-dm-profile">Mensaje</button>` : '')}
      </div>
    </div>
    <div class="tabs">
      <div class="tab-btn ${profileTab==='posts'?'active':''}" data-ptab="posts">Publicaciones</div>
      <div class="tab-btn ${profileTab==='replies'?'active':''}" data-ptab="replies">Respuestas</div>
      <div class="tab-btn ${profileTab==='likes'?'active':''}" data-ptab="likes">Me gusta</div>

  else if(profileTab==='replies') body = myReplies.length ? myReplies.map(r=>renderReply(r)).join('') : '<div class="empty"><b>Sin respuestas aún.</b></div>';
  else body = likedPosts.length ? likedPosts.map(([id,p])=>renderPost(id,p)).join('') : '<div class="empty"><b>Sin me gusta aún.</b></div>';

  wrap.innerHTML = header + `<div id="profile-tab-body">${body}</div>`;

  if(isMe) document.getElementById('btn-edit-profile').onclick=()=>switchView('settings');
  const dmBtn = document.getElementById('btn-dm-profile'); if(dmBtn) dmBtn.onclick = ()=>switchView('thread', uid);

      nombre,
      faccion: document.getElementById('cf-faccion').value.trim() || "Sin sede",
      grado: document.getElementById('cf-grado').value,
      avatar: document.getElementById('cf-avatar').value.trim(),
      bio: document.getElementById('cf-bio').value.trim(),
      googleName: currentUser.displayName || "",
      createdAt: (myChar && myChar.createdAt) || Date.now()
    };
    db.ref(`${ROOT}/users/${currentUser.uid}`).set(char).then(()=>{
      myChar = char;
      renderDrawer();
      renderComposer();
      switchView('feed');
    });
  };
}

/* ---------------- CHAT / DMs ---------------- */
function renderChatList(){
  const container = document.getElementById('chat-list');
  if(!(currentUser && myChar)){
    container.innerHTML = `<div class="guest-card"><h3>Necesitás una cuenta</h3><p>Iniciá sesión para chatear con otros hechiceros.</p><button id="chat-login">Crear cuenta / Iniciar sesión</button></div>`;
    document.getElementById('chat-login').onclick = ()=>switchView('settings');
    return;
  }
  const entries = Object.entries(dmIndex).sort((a,b)=>(b[1].lastAt||0)-(a[1].lastAt||0));
  if(entries.length===0){
    container.innerHTML = `<div class="empty"><b>Sin conversaciones.</b>Tocá el <b>+</b> arriba para empezar a chatear.</div>`;
    return;
  }
  container.innerHTML = entries.map(([otherUid, meta])=>{
    const u = allUsers[otherUid] || {nombre:'Hechicero'};
    return `<div class="chat-item" data-uid="${otherUid}">
      <img class="avatar" src="${avatarFor(u,otherUid)}">
      <div class="who"><div class="n">${escapeHtml(u.nombre)}</div><div class="last">${escapeHtml(meta.lastText||'')}</div></div>
      <div class="t">${timeAgo(meta.lastAt)}</div>
    </div>`;
  }).join('');
  container.querySelectorAll('.chat-item').forEach(el=> el.onclick=()=>switchView('thread', el.dataset.uid));
}

function openChatPicker(){
  const container = document.getElementById('chat-list');
  const users = Object.entries(allUsers).filter(([uid])=>uid!==currentUser.uid);
  container.innerHTML = `
    <div class="tb-search" style="margin:12px 16px;width:calc(100% - 32px);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input type="text" placeholder="Buscar hechicero..." id="picker-search"></div>
    <div class="picker-list" id="picker-list">
      ${users.map(([uid,u])=>`<div class="who-row" data-uid="${uid}"><img class="avatar" src="${avatarFor(u,uid)}"><div><div class="n">${escapeHtml(u.nombre)}</div><div class="f">${handleFor(u,uid)}</div></div></div>`).join('') || '<div class="empty"><b>No hay más hechiceros todavía.</b></div>'}
    </div>`;
  container.querySelectorAll('.who-row').forEach(el=> el.onclick=()=>switchView('thread', el.dataset.uid));
  document.getElementById('picker-search').addEventListener('input', e=>{
    const q = e.target.value.toLowerCase();
    document.querySelectorAll('#picker-list .who-row').forEach(row=>{
      const uid = row.dataset.uid; const u = allUsers[uid]||{};
      row.style.display = (u.nombre||'').toLowerCase().includes(q) ? 'flex' : 'none';
    });
  });
}

let threadListener = null;
function renderThread(){
  const wrap = document.getElementById('view-thread');
  wrap.innerHTML = `
    <div class="thread-wrap">
      <div class="thread-msgs" id="thread-msgs"><div class="empty"><b>Sin mensajes aún.</b>Escribí el primero.</div></div>
      <div class="thread-input">
        <input type="text" id="thread-text" placeholder="Escribí un mensaje..." maxlength="500">
        <button class="thread-send" id="thread-send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
      </div>
    </div>`;
  const pairId = pairIdFor(currentUser.uid, activeThreadUid);
  if(threadListener) threadListener.off();
  const ref = db.ref(`${ROOT}/dms/${pairId}/messages`);
  threadListener = ref;
  ref.on('value', snap=>{
    const msgs = snap.val() || {};
    const list = Object.values(msgs).sort((a,b)=>a.createdAt-b.createdAt);
    const box = document.getElementById('thread-msgs');
    if(!box) return;
    box.innerHTML = list.length ? list.map(m=>{
      const mine = m.from===currentUser.uid;
      return `<div class="bubble ${mine?'mine':'theirs'}">${escapeHtml(m.text)}<div class="bubble-time">${timeAgo(m.createdAt)}</div></div>`;
    }).join('') : '<div class="empty"><b>Sin mensajes aún.</b>Escribí el primero.</div>';
    box.scrollTop = box.scrollHeight;
  });
  const input = document.getElementById('thread-text');
  const sendBtn = document.getElementById('thread-send');
  function send(){
    const text = input.value.trim();
    if(!text) return;
    const mid = db.ref(`${ROOT}/dms/${pairId}/messages`).push().key;
    db.ref(`${ROOT}/dms/${pairId}/messages/${mid}`).set({ from: currentUser.uid, text, createdAt: Date.now() });
    const now = Date.now();
    db.ref(`${ROOT}/dm_index/${currentUser.uid}/${activeThreadUid}`).set({ lastText: text, lastAt: now });
    db.ref(`${ROOT}/dm_index/${activeThreadUid}/${currentUser.uid}`).set({ lastText: text, lastAt: now });
    input.value='';
  }
  sendBtn.onclick = send;
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
}

/* ---------------- ORÁCULO (IA con Groq) ---------------- */
function listenOraculo(){
  if(!currentUser) return;
  db.ref(`${ROOT}/oraculo/${currentUser.uid}/conversations`).on('value', snap=>{
    oraculoConvs = snap.val() || {};
    if(viewMode==='oraculo') renderOraculo();
  });
}
const ORACULO_CHIPS = [
  "Contame algo del lore de las sedes de ECOS",
  "Dame 3 ideas para mi próxima transmisión",
  "¿Qué significa mi grado de hechicero?",
  "Ayudame a escribir la bio de mi personaje"
];
const ORACULO_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/></svg>`;

function renderOraculo(){
  const wrap = document.getElementById('view-oraculo');
  if(!(currentUser && myChar)){
    wrap.innerHTML = `<div class="guest-card"><h3>Necesitás una cuenta</h3><p>Iniciá sesión para hablar con el Oráculo.</p><button id="oraculo-login">Crear cuenta / Iniciar sesión</button></div>`;
    document.getElementById('oraculo-login').onclick = ()=>switchView('settings');
    return;
  }
  const keyMissing = !GROQ_API_KEY || GROQ_API_KEY.indexOf("TU_GROQ")===0;

  if(!activeConvId){
    const convEntries = Object.entries(oraculoConvs).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));
    wrap.innerHTML = `
      <div class="oraculo-intro">${ORACULO_ICON}<h3>El Oráculo</h3><p>Una entidad amaldita que habita ECOS. Preguntale lo que quieras.</p></div>
      ${keyMissing ? `<div class="oraculo-key-warning">Todavía no configuraste tu <code>GROQ_API_KEY</code> arriba en el código.</div>` : ''}
      <div class="oraculo-chips" id="oraculo-chips">${ORACULO_CHIPS.map(c=>`<div class="oraculo-chip" data-chip="${escapeHtml(c)}">${escapeHtml(c)}</div>`).join('')}</div>
      ${convEntries.length ? `<h3 class="section-title">Conversaciones recientes</h3><div class="oraculo-convlist">${convEntries.map(([id,c])=>`<div class="oraculo-conv-row" data-id="${id}"><span>${escapeHtml(c.title||'Nueva conversación')}</span><span class="d">${timeAgo(c.createdAt)}</span></div>`).join('')}</div>` : ''}
      <div class="oraculo-input">
        <input type="text" id="oraculo-quick-text" placeholder="Pregunta cualquier cosa...">
        <button class="thread-send" id="oraculo-quick-send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
      </div>`;
    wrap.querySelectorAll('.oraculo-chip').forEach(el=> el.onclick=()=> startNewOraculoConv(el.dataset.chip));
    wrap.querySelectorAll('.oraculo-conv-row').forEach(el=> el.onclick=()=>{ activeConvId = el.dataset.id; renderOraculo(); });
    const qi = document.getElementById('oraculo-quick-text');
    const qs = document.getElementById('oraculo-quick-send');
    const go = ()=>{ const t=qi.value.trim(); if(t) startNewOraculoConv(t); };
    qs.onclick = go;
    qi.addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
    return;
  }

  const conv = oraculoConvs[activeConvId] || {messages:{}};
  const msgs = Object.entries(conv.messages||{}).sort((a,b)=>a[1].createdAt-b[1].createdAt);
  wrap.innerHTML = `
    <div class="thread-wrap">
      <div class="oraculo-msgs" id="oraculo-msgs">
        ${msgs.map(([id,m])=>oraculoBubble(m.role,m.text)).join('') || ''}
      </div>
      <div class="oraculo-input">
        <input type="text" id="oraculo-text" placeholder="Pregunta cualquier cosa..." ${keyMissing?'disabled':''}>
        <button class="thread-send" id="oraculo-send" ${keyMissing?'disabled':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
      </div>
    </div>`;
  const box = document.getElementById('oraculo-msgs');
  box.scrollTop = box.scrollHeight;
  const input = document.getElementById('oraculo-text');
  const sendBtn = document.getElementById('oraculo-send');
  const go2 = ()=>{ const t=input.value.trim(); if(!t) return; input.value=''; sendOraculoMessage(t); };
  sendBtn.onclick = go2;
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') go2(); });
}

function oraculoBubble(role, text){
  const icon = role==='assistant' ? ORACULO_ICON : AVATAR_ICON_SVG;
  return `<div class="om-row ${role==='user'?'user':'assistant'}">
    <div class="om-avatar">${icon}</div>
    <div class="om-bubble">${escapeHtml(text)}</div>
  </div>`;
}

function startNewOraculoConv(firstMessage){
  const convId = db.ref(`${ROOT}/oraculo/${currentUser.uid}/conversations`).push().key;
  activeConvId = convId;
  db.ref(`${ROOT}/oraculo/${currentUser.uid}/conversations/${convId}`).set({ createdAt: Date.now(), title: firstMessage ? firstMessage.slice(0,42) : null, messages: {} }).then(()=>{
    renderOraculo();
    if(firstMessage) sendOraculoMessage(firstMessage);
  });
}

function sendOraculoMessage(text){
  const convRef = db.ref(`${ROOT}/oraculo/${currentUser.uid}/conversations/${activeConvId}`);
  const mid1 = convRef.child('messages').push().key;
  convRef.child(`messages/${mid1}`).set({ role:'user', text, createdAt: Date.now() });

  const box = document.getElementById('oraculo-msgs');
  if(box){
    box.insertAdjacentHTML('beforeend', oraculoBubble('user', text));
    box.insertAdjacentHTML('beforeend', `<div class="om-row assistant" id="om-typing-row"><div class="om-avatar">${ORACULO_ICON}</div><div class="om-bubble om-typing"><span></span><span></span><span></span></div></div>`);
    box.scrollTop = box.scrollHeight;
  }

  const conv = oraculoConvs[activeConvId] || {messages:{}};
  const history = Object.values(conv.messages||{}).sort((a,b)=>a.createdAt-b.createdAt).map(m=>({role:m.role, content:m.text}));
  history.push({role:'user', content:text});

  fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: { "Content-Type":"application/json", "Authorization": "Bearer "+GROQ_API_KEY },
    body: JSON.stringify({
      model: GROQ_MODEL,
      messages: [{role:'system', content: ORACULO_SYSTEM_PROMPT}, ...history],
      temperature: 0.85,
      max_tokens: 500
    })
  }).then(r=>r.json()).then(data=>{
    const reply = data?.choices?.[0]?.message?.content || "El Oráculo guarda silencio... (no se pudo obtener respuesta, revisá tu GROQ_API_KEY).";
    const mid2 = convRef.child('messages').push().key;
    convRef.child(`messages/${mid2}`).set({ role:'assistant', text: reply, createdAt: Date.now() });
    if(!conv.title){ convRef.child('title').set(text.slice(0,42)); }
    const typingRow = document.getElementById('om-typing-row');
    if(typingRow) typingRow.outerHTML = oraculoBubble('assistant', reply);
    if(box) box.scrollTop = box.scrollHeight;
  }).catch(err=>{
    const mid2 = convRef.child('messages').push().key;
    const errText = "El Oráculo no responde. Revisá tu conexión o tu GROQ_API_KEY.";
    convRef.child(`messages/${mid2}`).set({ role:'assistant', text: errText, createdAt: Date.now() });
    const typingRow = document.getElementById('om-typing-row');
    if(typingRow) typingRow.outerHTML = oraculoBubble('assistant', errText);
  });
}

/* ---------------- Estado inicial ---------------- */
renderDrawer();
renderTopbar();
renderComposer();
renderFeed();
</script>
